<!doctype html><meta charset="utf-8"><title>Job Application - Greenhouse</title>
<body style="font:14px system-ui;max-width:600px;margin:30px auto">
<!-- Greenhouse's React Select: an input role=combobox whose menu is found via aria-controls.
     A decoy menu with 200 options is always open elsewhere, to prove scoping. -->
<div id="app">
<label for="first_name">First Name</label><input id="first_name" type="text">
<label for="email">Email</label><input id="email" type="email">
<div class="select__control"><label for="grad" id="grad-label">When do you expect to graduate?</label>
  <input id="grad" class="select__input" role="combobox" aria-controls="grad-menu" aria-labelledby="grad-label" type="text">
  <div class="select__single-value" id="grad-value"></div></div>
<div id="grad-menu"></div>
<!-- Figma's Location (City), as the live page builds it: select-shell >
     div > control, the menu a child of the shell (not beside the control).
     Opened empty it says "No options"; typing shows "Loading..." until a
     400ms search returns. aria-controls only appears once it is open. -->
<div class="select__container"><label for="loc" id="loc-label">Location (City)</label>
  <div class="select-shell"><div><div class="select__control"><input id="loc" class="select__input" role="combobox" type="text">
  <div class="select__single-value" id="loc-value"></div></div></div></div></div>
<div id="decoy" role="listbox"></div>
</div>
<script>
// With #rehydrate the whole form is thrown away and rebuilt 1.5s after load,
// as React does when hydration fails (Grammarly and other extensions edit
// the page first). Every element anything held is then detached.
const MARKUP = document.getElementById("app").innerHTML;
function wire() {
const decoy = document.getElementById("decoy");
for (let i = 0; i < 200; i++) decoy.insertAdjacentHTML("beforeend", `<div role="option">Country ${i}</div>`);
function combo(id, all, needsTyping) {
  const input = document.getElementById(id), menu = document.getElementById(id + "-menu");
  const render = (q) => {
    menu.innerHTML = "";
    const list = needsTyping && !q ? [] : all.filter((o) => o.toLowerCase().includes((q || "").toLowerCase()));
    for (const o of list) {
      const d = document.createElement("div"); d.setAttribute("role", "option"); d.textContent = o;
      d.addEventListener("click", () => { document.getElementById(id + "-value").textContent = o; input.value = ""; menu.innerHTML = ""; });
      menu.appendChild(d);
    }
  };
  input.addEventListener("click", () => render(input.value));
  input.addEventListener("input", () => render(input.value));
}
combo("grad", ["Fall 2026", "Spring 2027", "Fall 2027", "Spring 2028"], false);
// The live geocoder lists "Madison, Wisconsin, United States" twice (two
// places share the name), so the same wording appears as two options.
const locations = ["Madison, Wisconsin, United States", "Town of Madison, Wisconsin, United States",
  "Madison, Wisconsin, United States", "Madison, Alabama, United States"];
(() => {
  const input = document.getElementById("loc"), shell = input.closest(".select-shell");
  let timer, results = null;
  const render = (notice) => {
    shell.querySelector(".select__menu")?.remove();
    input.setAttribute("aria-controls", "react-select-loc-listbox");
    const menu = document.createElement("div"); menu.className = "select__menu";
    // Like the live page: the listbox aria-controls names exists even when
    // all it holds is a notice.
    if (notice) menu.innerHTML = `<div id="react-select-loc-listbox" role="listbox"><div class="select__menu-notice">${notice}</div></div>`;
    else {
      const list = document.createElement("div"); list.id = "react-select-loc-listbox"; list.setAttribute("role", "listbox");
      for (const o of results) {
        const d = document.createElement("div"); d.setAttribute("role", "option"); d.textContent = o;
        list.appendChild(d);
      }
      menu.appendChild(list);
    }
    shell.appendChild(menu);
  };
  // Opened empty, the live box shows a bare empty list: no options, no notice.
  // One delegated listener, as React has: a click on an option node that
  // has since been replaced never reaches it.
  shell.addEventListener("click", (e) => {
    const o = e.target.closest && e.target.closest('[role="option"]');
    if (!o) return;
    document.getElementById("loc-value").textContent = o.textContent;
    input.value = "";
    shell.querySelector(".select__menu")?.remove();
  });
  input.addEventListener("click", () => { results = []; render(null); });
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.split(",")[0].trim().toLowerCase();
    if (!q) return render("No options");
    render("Loading...");
    // Results render, then render again (a second response): the first
    // option nodes are replaced a moment after they appear.
    timer = setTimeout(() => {
      results = locations.filter((l) => l.toLowerCase().includes(q));
      render(results.length ? null : "No options");
      timer = setTimeout(() => render(results.length ? null : "No options"), 300);
    }, 400);
  });
})();
}
wire();
if (location.hash === "#rehydrate") setTimeout(() => {
  document.getElementById("app").innerHTML = MARKUP;
  wire();
  window.__rebuilt = true;
}, 1500);
</script></body>
