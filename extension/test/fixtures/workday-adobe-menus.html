<!doctype html>
<html><head><meta charset="utf-8"><title>Apply - Adobe - Workday</title>
<style>body{font:14px system-ui;max-width:640px;margin:30px auto}
[data-automation-id^="formField"]{margin:14px 0}
label{display:block;font-size:12px;color:#444}
.pop{position:absolute;background:#fff;border:1px solid #999;z-index:9;width:280px}
.pop ul{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto}
.pop li{height:20px;padding:0 6px;cursor:pointer}</style></head>
<body>
<!-- adobe.wd5.myworkdayjobs.com, 2026-09-29, from a live console log. This
     Workday build marks NO popup data-automation-activepopup, and a menu
     that has been closed lingers on screen. Reading by position then merged
     them: State came back "United States of America (+1) | Select One |
     Alabama | Alaska", and a Yes/No question was answered by clicking a row
     belonging to the question above it -- so "Yes" landed as "No", and the
     field itself stayed on Select One. Every menu here starts with a
     "Select One" row, as Adobe's do. -->
<main data-automation-id="applyFlowPage">
<h2>Application Questions</h2>
<div data-automation-id="formField-country-code"><label for="country-code">Country Phone Code</label>
 <button type="button" aria-haspopup="listbox" id="country-code" data-q="Country Phone Code" data-list="codes">Select One</button></div>
<div data-automation-id="formField-q-relocate"><label for="q-relocate">Are you able to work on a daily basis in the work location listed for this position?  If not, are you willing to relocate at your own expense to accept a position with Adobe?<abbr>*</abbr></label>
 <button type="button" aria-haspopup="listbox" id="q-relocate" data-q="relocate" data-list="yesno">Select One</button></div>
<div data-automation-id="formField-q-sponsor"><label for="q-sponsor">Will you now or in the future require sponsorship for employment visa status (e.g., H-1B visa status, spouse visa, etc)?<abbr>*</abbr></label>
 <button type="button" aria-haspopup="listbox" id="q-sponsor" data-q="sponsorship" data-list="yesno">Select One</button></div>
<div data-automation-id="formField-state"><label for="state">State</label>
 <button type="button" aria-haspopup="listbox" id="state" data-q="State" data-list="states">Select One</button></div>
</main>
<script>
window.__model = {};
const LISTS = {
  codes: ["Select One", "United States of America (+1)", "United Kingdom (+44)", "Canada (+1)"],
  yesno: ["Select One", "Yes", "No"],
  states: ["Select One", "Alabama", "Alaska", "Wisconsin", "Wyoming"],
};
// A closed menu is left on screen, exactly as this build leaves it: no
// activepopup attribute anywhere, and nothing but position to tell them
// apart -- which is what made a nearby list answer the wrong question.
function open(button) {
  const list = LISTS[button.dataset.list];
  const pop = document.createElement("div");
  pop.className = "pop";
  pop.dataset.forButton = button.id;
  const ul = document.createElement("ul");
  ul.setAttribute("role", "listbox");
  for (const text of list) {
    const li = document.createElement("li");
    li.setAttribute("role", "option");
    li.textContent = text;
    li.addEventListener("click", () => {
      // A "Select One" row picks nothing, as on Workday.
      if (text !== "Select One") { button.textContent = text; window.__model[button.dataset.q] = text; }
      pop.remove();
      button.setAttribute("aria-expanded", "false");
    });
    ul.appendChild(li);
  }
  pop.appendChild(ul);
  const r = button.getBoundingClientRect();
  pop.style.left = (scrollX + r.left) + "px";
  pop.style.top = (scrollY + r.bottom + 2) + "px";
  document.body.appendChild(pop);
  button.setAttribute("aria-expanded", "true");
  // The menu opened before this one stays in the DOM, on screen, for a
  // good while -- long enough to be read as if it were this one.
  for (const other of document.querySelectorAll(".pop")) {
    if (other !== pop) setTimeout(() => other.remove(), 4000);
  }
}
for (const button of document.querySelectorAll('button[aria-haspopup="listbox"]')) {
  button.setAttribute("aria-expanded", "false");
  button.addEventListener("click", () => open(button));
}
</script>
</body></html>
