<!doctype html>
<html><head><meta charset="utf-8"><title>Workday</title>
<style>body{font:14px system-ui;max-width:640px;margin:30px auto}.pop{position:absolute;background:#fff;border:1px solid #999}</style></head>
<body>
<!-- Workday's Application Questions step: nothing but dropdown questions,
     too few kinds of field for the generic application check, inside
     Workday's own apply flow (progressBar, applyFlowPage). -->
<nav data-automation-id="progressBar"><span>My Information</span> · <span data-automation-id="progressBarActiveStep">current step 3 of 6 Application Questions</span></nav>
<main data-automation-id="applyFlowPage">
<h2>Application Questions</h2>
<div data-automation-id="formField-q1"><label for="q1">Are you at least 18 years of age?</label>
 <button type="button" aria-haspopup="listbox" id="q1">Select One</button></div>
<div data-automation-id="formField-q2"><label for="q2">What are your salary expectations for this role?</label>
 <button type="button" aria-haspopup="listbox" id="q2">Select One</button></div>
<div data-automation-id="formField-q3"><label for="q3">Do you need, or will you need in the future, any immigration related support or sponsorship?</label>
 <button type="button" aria-haspopup="listbox" id="q3">Select One</button></div>
<!-- Self Identify (CC-305): one question, three checkboxes with their own
     names, "check one of the boxes below". -->
<div data-automation-id="formField-disabilityStatus" id="disability">
 <label>Please check one of the boxes below:<abbr>*</abbr></label>
 <div><input type="checkbox" id="d-yes" name="disability-yes"><label for="d-yes">Yes, I have a disability, or have had one in the past</label></div>
 <div><input type="checkbox" id="d-no" name="disability-no"><label for="d-no">No, I do not have a disability and have not had one in the past</label></div>
 <div><input type="checkbox" id="d-decline" name="disability-decline"><label for="d-decline">I do not want to answer</label></div>
</div>
</main>
</body></html>
