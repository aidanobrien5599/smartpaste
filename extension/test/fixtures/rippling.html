<!doctype html>
<html><head><meta charset="utf-8"><title>Apply - Account Executive, Broker Channel (TOLA)</title>
<style>body{font:14px system-ui;max-width:720px;margin:20px auto}
input{padding:4px;width:300px;display:block}
[role=combobox]{border:1px solid #999;padding:4px;width:300px;cursor:pointer}
[role=listbox]{border:1px solid #999;list-style:none;margin:0;padding:0;width:300px;background:#fff}
[role=option]{padding:3px 6px;cursor:pointer}</style></head>
<body>
<!-- Rippling's own ATS (ats.rippling.com/<company>/jobs/<id>/apply), trimmed
     from its live markup on 2026-09-23. Hashed emotion class names and the
     random per-load field names are kept as they come.

     What broke smartpaste: every dropdown here is a <div role="combobox"
     aria-haspopup="listbox">, never a <select> or a <button>, so nothing
     collected them -- the whole EEO block and a required sponsorship
     question were invisible. Three name themselves with aria-labelledby,
     which listboxLabel never read; the fourth names nothing at all and
     keeps its question in a paragraph above the field's block.

     The text boxes are <input> with no type= at all, labelled the same way;
     those already worked and are here so the page reads as an application. -->
<form>
<div class="css-fc738i e1c985fr0">
  <div class="css-fuqajr eun831x1" data-testid="field">
    <div class="css-1w8xq0 eun831x4"><span id="field-8-label" class="css-1xdhyk6 eun831x3">First name</span></div>
    <div class="css-1fttcpj eun831x6"><div data-testid="first_name" class="css-1mlcsw efnm4lm1">
      <input data-input="first_name" id="field-8" aria-required="true" autocomplete="off" placeholder="First name" aria-labelledby="field-8-label" class="css-d76fs efnm4lm5" value="" name="o8qrmh068M" data-key="First name">
    </div></div>
  </div>
  <div class="css-fuqajr eun831x1" data-testid="field">
    <div class="css-1w8xq0 eun831x4"><span id="field-16-label" class="css-1xdhyk6 eun831x3">Email</span></div>
    <div class="css-1fttcpj eun831x6"><div data-testid="email" class="css-1mlcsw efnm4lm1">
      <input data-input="email" id="field-16" aria-required="true" autocomplete="off" placeholder="Email" aria-labelledby="field-16-label" class="css-d76fs efnm4lm5" value="" name="eREPwn_KP19" data-key="Email">
    </div></div>
  </div>
  <div class="css-fuqajr eun831x1" data-testid="field">
    <div class="css-1w8xq0 eun831x4"><span id="field-31-label" class="css-1xdhyk6 eun831x3">Phone number</span></div>
    <div class="css-1fttcpj eun831x6"><div data-testid="phone_number" class="css-1mlcsw efnm4lm1">
      <input data-input="phone_number" id="field-31" aria-required="true" inputmode="tel" placeholder="Phone number" aria-labelledby="field-31-label" class="css-d76fs efnm4lm5" value="" name="wkD_dcvuV9G" data-key="Phone number">
    </div></div>
  </div>
  <div class="css-fuqajr eun831x1" data-testid="field">
    <div class="css-1w8xq0 eun831x4"><span id="field-51-label" class="css-1xdhyk6 eun831x3">LinkedIn Link</span></div>
    <div class="css-1fttcpj eun831x6"><div data-testid="linkedin_link" class="css-1mlcsw efnm4lm1">
      <input data-input="linkedin_link" id="field-51" aria-required="true" placeholder="LinkedIn Link" aria-labelledby="field-51-label" class="css-d76fs efnm4lm5" value="" name="xmoGlQupJMk" data-key="LinkedIn Link">
    </div></div>
  </div>

  <!-- A custom question: the dropdown names nothing, and its question is a
       <p> in a block above the field, six levels up from the combobox. -->
  <div class="marginY--36">
    <div class="paddingX--16"><div class="marginBottom--4">
      <p class="css-i4dt0z edalr1o0">Do you require sponsorship now or in the future to work in the US<div class="css-18yxg8r"></div></p>
    </div></div>
    <div class="css-2a15f5 eun831x1" data-testid="field"><div class="css-1fttcpj eun831x6">
      <div data-testid="customQuestions.6a4fd99f44fd3e8658087660.b244b298" class="css-1y9duzt e1yeqa1v2"><div>
        <div data-testid="select-controller" class="css-1gj4tap etc2niq4"><div class="css-18c1nrl etc2niq7">
          <div id="field-59" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-label="Select" aria-required="true" aria-invalid="false" aria-disabled="false" tabindex="0" class="css-hyyaj0 etc2niq5" data-list="field-59-list" data-key="Sponsorship"><p class="css-1lilszh">Select</p></div>
        </div></div>
      </div></div>
    </div></div>
  </div>
</div>

<div class="css-1bccrkd edsygcu0"><div class="css-fc738i e1c985fr0">
  <div class="marginTop--16 marginBottom--24"><p class="css-16e3h2y edalr1o0">U.S. Equal Opportunity Employment Information (Completion is voluntary)</p></div>
  <div class="marginBottom--24 css-fuqajr eun831x1" data-testid="field">
    <div class="css-1w8xq0 eun831x4"><span aria-describedby="field-tip-66" id="field-65-label" class="css-1xdhyk6 eun831x3">Gender</span></div>
    <div class="css-1fttcpj eun831x6"><div data-testid="eeoc.gender" class="css-1y9duzt e1yeqa1v2"><div>
      <div data-testid="select-controller" class="css-1gj4tap etc2niq4"><div class="css-18c1nrl etc2niq7">
        <div id="field-65" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="field-65-label" aria-label="Select..." aria-required="false" aria-disabled="false" tabindex="0" class="css-hyyaj0 etc2niq5" data-list="field-65-list" data-key="Gender"><p class="css-1lilszh">Select...</p></div>
      </div></div>
    </div></div></div>
  </div>
  <div class="marginBottom--24 css-fuqajr eun831x1" data-testid="field">
    <div class="css-1w8xq0 eun831x4"><span id="field-78-label" class="css-1xdhyk6 eun831x3">Are you Hispanic/Latino?</span></div>
    <div class="css-1fttcpj eun831x6"><div data-testid="eeoc.hispanic" class="css-1y9duzt e1yeqa1v2"><div>
      <div data-testid="select-controller" class="css-1gj4tap etc2niq4"><div class="css-18c1nrl etc2niq7">
        <div id="field-78" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="field-78-label" aria-label="Select..." aria-required="false" aria-disabled="false" tabindex="0" class="css-hyyaj0 etc2niq5" data-list="field-78-list" data-key="Hispanic"><p class="css-1lilszh">Select...</p></div>
      </div></div>
    </div></div></div>
  </div>
  <div class="marginBottom--24 css-fuqajr eun831x1" data-testid="field">
    <div class="css-1w8xq0 eun831x4"><span id="field-84-label" class="css-1xdhyk6 eun831x3">Veteran Status</span></div>
    <div class="css-1fttcpj eun831x6"><div data-testid="eeoc.veteran" class="css-1y9duzt e1yeqa1v2"><div>
      <div data-testid="select-controller" class="css-1gj4tap etc2niq4"><div class="css-18c1nrl etc2niq7">
        <div id="field-84" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="field-84-label" aria-label="Select..." aria-required="false" aria-disabled="false" tabindex="0" class="css-hyyaj0 etc2niq5" data-list="field-84-list" data-key="Veteran"><p class="css-1lilszh">Select...</p></div>
      </div></div>
    </div></div></div>
  </div>
</div></div>
</form>

<script>
window.__model = {};
document.addEventListener("input", (e) => {
  if (e.target.dataset.key) window.__model[e.target.dataset.key] = e.target.value;
}, true);

// Rippling's dropdowns: a click opens a <ul role="listbox"> beside the
// combobox, and an option's click writes its text into the combobox's <p>.
const OPTIONS = {
  "field-59-list": ["Yes", "No"],
  "field-65-list": ["Male", "Female", "I do not wish to answer"],
  "field-78-list": ["Yes", "No", "I do not wish to answer"],
  "field-84-list": ["I am not a protected veteran", "I identify as one or more of the classifications of a protected veteran", "I do not wish to answer"],
};
for (const combo of document.querySelectorAll('[role=combobox]')) {
  const id = combo.dataset.list;
  const open = () => {
    if (document.getElementById(id)) return;
    const list = document.createElement("ul");
    list.id = id;
    list.setAttribute("role", "listbox");
    list.setAttribute("data-testid", "menuList");
    list.innerHTML = OPTIONS[id].map((text, i) =>
      `<li data-idx="${i}" data-selectable="true" id="${id}-option-${i}" role="option" aria-selected="false" aria-disabled="false"><div><div><div data-testid="menuListLabel"><p>${text}</p></div></div></div></li>`).join("");
    combo.setAttribute("aria-expanded", "true");
    combo.parentElement.appendChild(list);
    for (const option of list.querySelectorAll("[role=option]")) {
      option.addEventListener("click", () => {
        combo.querySelector("p").textContent = option.textContent;
        window.__model[combo.dataset.key] = option.textContent;
        close();
      });
    }
  };
  const close = () => {
    document.getElementById(id)?.remove();
    combo.setAttribute("aria-expanded", "false");
  };
  combo.addEventListener("click", () => (document.getElementById(id) ? close() : open()));
  combo.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
}
</script>
</body></html>
