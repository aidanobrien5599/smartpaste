[project]
name = "smartpaste"
version = "0.1.0"
description = "Fill a job application from your own resume, using Jev to pick and code to extract."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4", "pdfminer.six>=20240706"]

[project.scripts]
sp = "smartpaste.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smartpaste"]
