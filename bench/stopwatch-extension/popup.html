<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui; width: 420px; margin: 12px; }
  label { display: block; margin: 6px 0; }
  input[type=text] { width: 100%; padding: 4px; box-sizing: border-box; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .muted { color: #777; }
</style>
<label><input type="checkbox" id="enabled"> Record runs (reload the page after turning on)</label>
<label>Tool being timed <input type="text" id="tool" placeholder="e.g. smartpaste, simplify"></label>
<table><thead><tr><th>Tool</th><th>Fill</th><th>Form shown</th><th>Fields</th><th>Load</th></tr></thead><tbody id="runs"></tbody></table>
<div class="row"><button id="copy">Copy all as JSON</button><button id="clear">Clear</button><span id="status" class="muted"></span></div>
<script src="popup.js"></script>
